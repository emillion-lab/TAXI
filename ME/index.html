<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТАКСИМИ СОФИЯ — парк и движения</title>
<style>
:root{
  --bg:#0a1020; --panel:#111c30; --line:#1e2d47; --ink:#dce7f7; --dim:#7f92ad;
  --in:#3ddc97; --out:#ff6b6b; --mark:#fbbf24; --acc:#4cc3ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.2px}
h2{font-size:15px;font-weight:600;margin:26px 0 10px;color:var(--acc)}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px 6px}
svg{width:100%;height:auto;display:block;overflow:visible}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11px;color:var(--dim)}
.note{border-left:3px solid var(--mark);background:rgba(251,191,36,.07);
 padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:14px 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
summary{padding:11px 12px;cursor:pointer;list-style:none;display:flex;
 justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
.per{font-variant-numeric:tabular-nums;font-size:13.5px}
.badges{display:flex;gap:5px;flex-shrink:0}
.b{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.b.i{color:var(--in);background:rgba(61,220,151,.12)}
.b.o{color:var(--out);background:rgba(255,107,107,.12)}
.b.z{color:var(--dim);background:rgba(127,146,173,.12)}
.body{padding:0 12px 12px;border-top:1px solid var(--line)}
.mv{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mv:last-child{border-bottom:0}
.mv .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv .m{color:var(--dim);font-size:12px}
.arr{color:var(--dim)}
.empty{color:var(--dim);font-size:13px;padding:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.src{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.7}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<h1>ТАКСИМИ СОФИЯ ЕООД</h1>
<p class="sub">Брой коли в регистъра на ИААА и движения към и от други фирми. Изчислено по регистрационен номер между последователните снимки в <a href="https://github.com/emillion-lab/TAXI">emillion-lab/TAXI</a>.</p>
<div class="hero"><svg id="chart" viewBox="0 0 700 300" role="img" aria-label="Брой коли по дати"></svg></div>
<div class="kpis">
  <div class="kpi"><b id="kNow">—</b><span>коли на 01.09</span></div>
  <div class="kpi"><b id="kYtd">—</b><span>от 24.03</span></div>
  <div class="kpi"><b id="kAug">—</b><span>нето след 26.08</span></div>
</div>
<div class="note" id="commNote"></div>
<h2>Движения по периоди</h2>
<div id="periods"></div>
<h2>Трансфери между всички фирми</h2>
<div id="pairs"></div>
<p class="src" id="src"></p>
</div>
<script>

СТРА НОЧБАК"},{"plate":"СВ0402ХР","other":"МЕГАТАКСИ 2000 ЕООД","model":"КИА К5"},{"plate":"СВ7871РК","other":"ЙЕЛОУ 333 АД","model":"КИА СИИД"}],"out":[{"plate":"СВ9428НК","other":"О'' КЕЙ СУПЕРТРАНС АД","model":"ТОЙОТА АУРИС"},{"plate":"СВ9969НР","other":"РАДИО СВ ТАКСИ ООД","model":"КИА СИИД"},{"plate":"СО5256СТ","other":"РАДИО СВ ТАКСИ ООД","model":"ТОЙОТА АУРИС"},{"plate":"СВ5886МЕ","other":"ОЖ ЕКСПРЕСТРАНС ЕООД","model":"ХЮНДАЙ И 40"},{"plate":"СВ4329ХС","other":"ОЖ ЕКСПРЕСТРАНС ЕООД","model":"ХЮНДАЙ И 40"},{"plate":"СВ8530ОЕ","other":"ЙЕЛОУ 333 АД","model":"КИА К 8"},{"plate":"СТ2590ТН","other":"ТАКСИ ГРУП ЕООД","model":"КИА К5"},{"plate":"СВ9913КЕ","other":"ПАНДА ТАКСИ ООД","model":"КИА К5"},{"plate":"СВ6402ВЕ","other":"ЗАЕДНО В ЕВРОПА - ОК ТАКСИ ЕООД","model":"ХЮНДАЙ СОНАТА"}],"new":33,"gone":11,"top":[{"f":"РЕФЛЕКС ПЛЮС ЕООД","t":"ОТ-СИТИТРАНС ЕООД","n":6},{"f":"ЙЕЛОУ 333 АД","t":"ТАКСИМИ СОФИЯ ЕООД","n":3},{"f":"РАДИО СВ ТАКСИ ООД","t":"ТАКСИМИ СОФИЯ ЕООД","n":2},{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"РАДИО СВ ТАКСИ ООД","n":2},{"f":"ИНЕКС-ТАКСИ ООД","t":"ТАКСИМИ СОФИЯ ЕООД","n":2},{"f":"ТАКСИ ПЛЮС БЪЛГАРИЯ ЕООД","t":"ЙЕЛОУ 333 АД","n":2},{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"ОЖ ЕКСПРЕСТРАНС ЕООД","n":2},{"f":"МЕГАТАКСИ 2000 ЕООД","t":"СУПЕР ПЛЮС ООД","n":1},{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"О'' КЕЙ СУПЕРТРАНС АД","n":1},{"f":"ИНЕКС-ТАКСИ ООД","t":"ЗАЕДНО В ЕВРОПА - ОК ТАКСИ ЕООД","n":1},{"f":"ОТ-СИТИТРАНС ЕООД","t":"ТАКСИМИ СОФИЯ ЕООД","n":1},{"f":"О'' КЕЙ СУПЕРТРАНС АД","t":"ТАКСИМИ СОФИЯ ЕООД","n":1}]},{"from":"2026-07-20","to":"2026-07-21","moved":2,"in":[],"out":[],"new":0,"gone":1,"top":[{"f":"ЗАЕДНО В ЕВРОПА - ОК ТАКСИ ЕООД","t":"О'' КЕЙ СУПЕРТРАНС АД","n":1},{"f":"РЕФЛЕКС ПЛЮС ЕООД","t":"ОН-СИТИТРАНС ЕООД","n":1}]},{"from":"2026-07-21","to":"2026-08-01","moved":2,"in":[],"out":[{"plate":"ЕА1305АК","other":"ЙЕЛОУ 333 АД","model":"КИА НИРО"}],"new":10,"gone":3,"top":[{"f":"ОТ-СИТИТРАНС ЕООД","t":"ЙЕЛОУ 333 АД","n":1},{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"ЙЕЛОУ 333 АД","n":1}]},{"from":"2026-08-01","to":"2026-08-29","moved":10,"in":[{"plate":"СВ2302ХН","other":"ЙЕЛОУ 333 АД","model":"КИА К5"},{"plate":"СВ6468ТХ","other":"ЗАЕДНО В ЕВРОПА - ОК ТАКСИ ЕООД","model":"ХЮНДАЙ СОНАТА"}],"out":[{"plate":"СВ8928ХЕ","other":"ЙЕЛОУ 333 АД","model":"КИА К5"},{"plate":"СВ2066ЕО","other":"ЙЕЛОУ 333 АД","model":"КИА К5"},{"plate":"СВ9216ХЕ","other":"ЙЕЛОУ 333 АД","model":"КИА К5"},{"plate":"СВ7050ХС","other":"СУПЕР ПЛЮС ООД","model":"КИА РИО"},{"plate":"СВ8906ХЕ","other":"ЙЕЛОУ 333 АД","model":"КИА К5"}],"new":23,"gone":9,"top":[{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"ЙЕЛОУ 333 АД","n":4},{"f":"ЙЕЛОУ 333 АД","t":"ТАКСИМИ СОФИЯ ЕООД","n":1},{"f":"МЕГАТАКСИ 2000 ЕООД","t":"ОН-СИТИТРАНС ЕООД","n":1},{"f":"ТРАНС ТРЕЙД ЛОГИСТИК  ЕООД","t":"О'' КЕЙ СУПЕРТРАНС АД","n":1},{"f":"ЗАЕДНО В ЕВРОПА - ОК ТАКСИ ЕООД","t":"ТАКСИМИ СОФИЯ ЕООД","n":1},{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"СУПЕР ПЛЮС ООД","n":1},{"f":"ПРЕСТИЖ ТАКСИ ЕООД","t":"ТАКСИНА ЕООД","n":1}]},{"from":"2026-08-29","to":"2026-09-01","moved":0,"in":[],"out":[],"new":0,"gone":0,"top":[]},{"from":"2026-09-01","to":"2026-09-13","moved":1,"in":[],"out":[{"plate":"СВ8764ОЕ","other":"О'' КЕЙ СУПЕРТРАНС АД","model":"КИА К5"}],"new":20,"gone":6,"top":[{"f":"ТАКСИМИ СОФИЯ ЕООД","t":"О'' КЕЙ СУПЕРТРАНС АД","n":1}]}]};
const COMM = '2026-08-26';                 // нови комисионни
const fmt = s => s.slice(8,10)+'.'+s.slice(5,7);
const full = s => s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4);
const S = D.series, IV = D.intervals;

/* ---- график ---- */
(function(){
  const W=700,H=300,L=44,R=14,T=18,B=30;
  const xs=S.map(p=>Date.parse(p.date));
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const ys=S.map(p=>p.count);
  const lo=Math.floor((Math.min(...ys)-15)/10)*10, hi=Math.ceil((Math.max(...ys)+15)/10)*10;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  for(let v=lo;v<=hi;v+=Math.max(10,Math.round((hi-lo)/5/10)*10)){
    g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#1e2d47"/>`
      +`<text x="${L-8}" y="${Y(v)+4}" fill="#7f92ad" font-size="11" text-anchor="end">${v}</text>`;
  }
  const cx=X(Date.parse(COMM));
  g+=`<line x1="${cx}" y1="${T}" x2="${cx}" y2="${H-B}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>`
   +`<text x="${cx-6}" y="${T+12}" fill="#fbbf24" font-size="11" text-anchor="end">26.08 комисионни</text>`;
  const d=S.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.count).toFixed(1)).join(' ');
  g+=`<path d="${d} L${X(x1).toFixed(1)} ${H-B} L${X(x0).toFixed(1)} ${H-B} Z" fill="rgba(76,195,255,.10)"/>`;
  g+=`<path d="${d}" fill="none" stroke="#4cc3ff" stroke-width="2.5" stroke-linejoin="round"/>`;
  S.forEach((p,i)=>{
    g+=`<circle cx="${X(xs[i])}" cy="${Y(p.count)}" r="3.5" fill="#0a1020" stroke="#4cc3ff" stroke-width="2"/>`;
    if(i===0||i===S.length-1||i===S.length-2)
      g+=`<text x="${X(xs[i])}" y="${Y(p.count)-11}" fill="#dce7f7" font-size="12" font-weight="700" text-anchor="middle">${p.count}</text>`;
    if(i%2===0||i===S.length-1)
      g+=`<text x="${X(xs[i])}" y="${H-10}" fill="#7f92ad" font-size="10.5" text-anchor="middle">${fmt(p.date)}</text>`;
  });
  document.getElementById('chart').innerHTML=g;
})();

/* ---- KPI ---- */
const last=S[S.length-1], first=S[0];
document.getElementById('kNow').textContent=last.count;
const dY=last.count-first.count;
document.getElementById('kYtd').textContent=(dY>0?'+':'')+dY;
const after=IV.filter(i=>i.from>=COMM);
const net=after.reduce((a,i)=>a+i.in.length-i.out.length,0);
document.getElementById('kAug').textContent=(net>0?'+':'')+net;

/* ---- отговор за комисионните ---- */
const straddle=IV.find(i=>i.from<COMM&&i.to>=COMM);
const moves=after.reduce((a,i)=>a+i.moved,0);
document.getElementById('commNote').innerHTML=
 `<b>След 26.08.2026</b> регистърът има само снимките от ${after.map(i=>full(i.to)).join(' и ')}. `
 +`В този отрязък има <b>${moves}</b> смени на фирма в цяла София — тоест ефект от новите комисионни още не се вижда. `
 +`Периодът ${full(straddle.from)}–${full(straddle.to)} обхваща датата, но почти целият му обем е отпреди нея. `
 +`За реален отговор трябва свежо теглене след 13.09.`;

/* ---- периоди ---- */
const row=(m,dir)=>`<div class="mv"><span class="p">${m.plate}</span>`
 +`<span><span class="arr">${dir==='in'?'от':'към'}</span> ${m.other}<br><span class="m">${m.model||''}</span></span></div>`;
document.getElementById('periods').innerHTML=IV.slice().reverse().map(i=>{
  const n=i.in.length,o=i.out.length;
  return `<details><summary>`
   +`<span class="per">${full(i.from)} → ${full(i.to)}</span>`
   +`<span class="badges"><span class="b ${n?'i':'z'}">+${n}</span><span class="b ${o?'o':'z'}">−${o}</span></span>`
   +`</summary><div class="body">`
   +(n?`<div>${i.in.map(m=>row(m,'in')).join('')}</div>`:'')
   +(o?`<div>${i.out.map(m=>row(m,'out')).join('')}</div>`:'')
   +((n+o)?'':'<div class="empty">Няма коли, сменили фирма в този период.</div>')
   +`<div class="empty">Отделно: ${i.new} нови в ТАКСИМИ, ${i.gone} излезли от регистъра.</div>`
   +`</div></details>`;
}).join('');

/* ---- двойки фирми ---- */
document.getElementById('pairs').innerHTML=IV.slice().reverse().filter(i=>i.top.length).map(i=>
  `<details><summary><span class="per">${full(i.from)} → ${full(i.to)}</span>`
  +`<span class="badges"><span class="b i">${i.moved} коли</span></span></summary>`
  +`<div class="body"><table>${i.top.map(p=>
     `<tr><td>${p.f}<br><span class="m arr">↓</span> ${p.t}</td><td class="n">${p.n}</td></tr>`).join('')}
   </table></div></details>`).join('');

document.getElementById('src').textContent=
 'Източник: '+S.length+' снимки на регистъра, '+full(first.date)+' – '+full(last.date)
 +'. Колата се брои като преместена само ако същият регистрационен номер стои под друга фирма в следващата снимка. '
 +'Данните са вградени в страницата — обновяват се при преизчисление след ново теглене.';
