name: auto-base
on:
  push:
    paths:
      - '*.json'
      - '.github/workflows/auto-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  point-base2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point база 2 to newest taxi_data file
        run: |
          python3 - <<'EOF'
          import re, glob, sys
          def key(fn):
              m = re.search(r'taxi_data_Sofia(\d{1,2})\.(\d{1,2})\.(\d{2,4})\.json$', fn)
              if not m: return None
              d, mo, y = int(m.group(1)), int(m.group(2)), int(m.group(3))
              if y < 100: y += 2000
              return (y, mo, d)
          files = [(key(f), f) for f in glob.glob('taxi_data_*.json')]
          files = [x for x in files if x[0]]
          if not files:
              print('no taxi_data files'); sys.exit(0)
          newest = max(files)[1]
          src = open('index.html', encoding='utf-8').read()
          pat = r"autoFetch\(base\+'taxi_data_[^']*',2\)"
          if not re.search(pat, src):
              print('marker not found — code changed, aborting to be safe'); sys.exit(1)
          new = re.sub(pat, "autoFetch(base+'" + newest + "',2)", src)
          if new == src:
              print('already pointing to', newest); sys.exit(0)
          open('index.html', 'w', encoding='utf-8').write(new)
          print('база 2 →', newest)
          EOF

      - name: Commit if changed
        run: |
          git config user.name auto-base
          git config user.email auto-base@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "auto: база 2 → най-новият taxi_data JSON" && git push)
