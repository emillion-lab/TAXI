name: Patch List Files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply listFiles patch
        run: |
          python3 scripts/patch_listfiles.py
          python3 -c "
          import re,io
          h=io.open('index.html',encoding='utf-8').read()
          m=re.findall(r'<script>(.*?)</script>',h,re.S)
          io.open('/tmp/c.js','w',encoding='utf-8').write(max(m,key=len))
          "
          node --check /tmp/c.js && echo 'JS SYNTAX OK'
          git config user.name ci; git config user.email ci@taxi
          git add index.html
          git diff --cached --quiet && echo 'нищо за commit' && exit 0
          git commit -m "fix: панелът чете списъка със снимки от манифест, после от GitHub API; без мъртви резервни имена [skip ci]"
          git fetch origin main && git rebase origin/main || true
          git push
