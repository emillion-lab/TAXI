name: registry-pull
on:
  schedule:
    - cron: '0 3 1,15 * *'   # 1-во и 15-то число всеки месец, 06:00 София
  workflow_dispatch:
    inputs:
      force:
        description: 'Запиши снимката дори при рязък спад спрямо предишната (само ако промяната е истинска)'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/registry-pull.yml'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull ИААА taxi register — САМО София (TAXI е софийско репо)
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.parse, json, time, datetime, sys, gzip, glob, os
          # ВАЖНО: това репо е София-само. Националният pull (Q='') живее другаде —
          # смесени бази чупят сравнението НОВИ/ТРЪГНАЛИ в index.html.
          Q = 'София'
          STEP = 100
          FORCE = os.environ.get('FORCE', '').lower() == 'true'


          def fetch(start, end):
              url = (f'https://taxireg.infosys.bg/TaxiReg/api/custom/publicregister/query'
                     f'?rowBegin={start}&rowEnd={end}&q={urllib.parse.quote(Q)}&sort=createdAt&order=desc')
              for attempt in range(1, 5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
                      return json.loads(urllib.request.urlopen(req, timeout=60).read().decode('utf-8'))
                  except Exception as e:
                      print(f'FETCH ERROR at {start} (опит {attempt}/4) :: {e}')
                      time.sleep(5 * attempt)
              # Непълна снимка е по-лоша от липсваща: изчезналите коли излизат като ТРЪГНАЛИ.
              print('Страницата не можа да се изтегли — не записвам непълна снимка.')
              sys.exit(1)


          start, all_rows = 1, []
          while True:
              end = start + STEP - 1
              data = fetch(start, end)
              rows = data if isinstance(data, list) else (data.get('rows') or [])
              if not rows:
                  break
              all_rows.extend(rows)
              print(f'{start}-{end}: +{len(rows)} (общо {len(all_rows)})')
              start += STEP
              time.sleep(0.6)

          if len(all_rows) < 100:
              print('Подозрително малко записи — не записвам.'); sys.exit(1)

          # Регистърът се променя по време на странициране (sort=createdAt) — възможен е
          # запис да се появи на две страници. Един лиценз = един запис.
          seen, uniq = set(), []
          for r in all_rows:
              k = r.get('taxiOperatorLicenseId')
              if k is not None and k in seen:
                  continue
              seen.add(k)
              uniq.append(r)
          if len(uniq) != len(all_rows):
              print(f'Премахнати дубликати от странициране: {len(all_rows) - len(uniq)}')
          all_rows = uniq

          t = datetime.date.today()
          # Снимките се пазят компресирани: ~1.3 MB вместо ~19 MB. Причината е
          # GitHub Pages (сервира разопакованото дърво, таван 1 GB) и мобилният
          # трафик — панелът тегли две бази при всяко отваряне. Браузърът
          # разопакова с DecompressionStream, виж bufToJson в index.html.
          fname = f'Sofia_{t.isoformat()}.json.gz'

          # Проверка за пълнота спрямо предишната снимка. Реален спад е около 1% парк
          # (виж 28.10: -83 коли от 8791); над прага се спира, освен ако не е force.
          prev = [p for p in sorted(glob.glob('Sofia_*.json.gz')) if p != fname]
          nv = sum(len(o.get('vehicles') or []) for o in all_rows)
          if prev:
              with gzip.open(prev[-1], 'rt', encoding='utf-8') as fh:
                  pd = json.load(fh)
              pv = sum(len(o.get('vehicles') or []) for o in pd)
              print(f'Спрямо {prev[-1]}: записи {len(pd)} -> {len(all_rows)}, коли {pv} -> {nv}')
              if len(all_rows) < 0.97 * len(pd) or nv < 0.85 * pv:
                  if FORCE:
                      print('ВНИМАНИЕ: рязък спад, но е зададен force — записвам.')
                  else:
                      print('Рязък спад спрямо предишната снимка (записи <97% или коли <85%) — не записвам. '
                            'Ако промяната е истинска, пусни ръчно с force=true.')
                      sys.exit(1)

          with gzip.GzipFile(fname, 'wb', compresslevel=9, mtime=0) as fh:
              fh.write(json.dumps(all_rows, ensure_ascii=False).encode('utf-8'))
          print('Записано:', fname, '| записи:', len(all_rows), '| коли:', nv)
          open('registry-pull-report.txt', 'w', encoding='utf-8').write(
              f'{t}: {len(all_rows)} записа -> {fname}\n')
          PYEOF

      - name: Commit
        run: |
          git config user.name registry-bot; git config user.email registry-bot@taxi
          # Манифест за панела: списък със снимките без обръщане към GitHub API.
          python3 -c "import glob,json; open('snapshots.json','w',encoding='utf-8').write(json.dumps(sorted(glob.glob('Sofia_*.json.gz')), ensure_ascii=False))"
          git add Sofia_*.json.gz registry-pull-report.txt snapshots.json
          git diff --cached --quiet || (git commit -m "registry: auto-pull, София" && git push)

      - name: Rebuild ME
        run: |
          python3 scripts/build_me.py
          git add ME/index.html
          git diff --cached --quiet || (git commit -m "ME: преизчислено след теглене" && git push)
