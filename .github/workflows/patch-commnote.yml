name: Patch Comm Note
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply commNote patch
        run: |
          python3 scripts/patch_commnote.py
          python3 -c "
          import re,io
          h=io.open('ME/index.html',encoding='utf-8').read()
          m=re.search(r'<script>(.*)</script>',h,re.S)
          io.open('/tmp/c.js','w',encoding='utf-8').write(m.group(1))
          "
          node --check /tmp/c.js && echo 'JS SYNTAX OK'
          git config user.name ci; git config user.email ci@taxi
          git add ME/index.html
          git diff --cached --quiet && echo 'нищо за commit' && exit 0
          git commit -m "fix: бележката за комисионните в ME се смята от данните, без остарели твърдения [skip ci]"
          git fetch origin main && git rebase origin/main || true
          git push
