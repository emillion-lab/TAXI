name: normalize-names
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Преименувай snapshot-ите в единен формат Sofia_YYYY-MM-DD.json
        run: |
          git config user.name registry-bot; git config user.email registry-bot@taxi
          git mv "Sofia_24.03.2026.json" "Sofia_2026-03-24.json"
          git mv "Sofia_09.05.2026.json" "Sofia_2026-05-09.json"
          git mv "taxi_data_Sofia8.6.26.json" "Sofia_2026-06-08.json"
          git mv "taxi_data_Sofia15.06.2026.json" "Sofia_2026-06-15.json"
          git mv "taxi_data_Sofia20.07.2026.json" "Sofia_2026-07-20.json"
          git mv "taxi_data_Sofia21.7.2026.json" "Sofia_2026-07-21.json"
          git mv "taxi_data_Sofia1.8.2026.json" "Sofia_2026-08-01.json"
          git mv "taxi_data_Sofia29.08.2026.json" "Sofia_2026-08-29.json"
          git commit -m "нормализация: всички snapshot файлове -> Sofia_YYYY-MM-DD.json"
          git push
