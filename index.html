<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Taxi Pro v72.0 - Active vs Expired Stats</title>
  <style>
    :root {
      --bg: #050910; --panel: #0f172a; --accent: #22c55e; --text: #f8fafc;
      --muted: #94a3b8; --highlight: #facc15; --line: #1e293b; --blue: #3b82f6; --red: #ef4444;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: #020617; border-bottom: 2px solid var(--accent); padding: 8px; flex-shrink: 0; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .version { color: var(--accent); font-weight: 900; font-size: 16px; }
    .json-date { font-size: 11px; color: var(--highlight); font-weight: bold; border: 1px solid var(--highlight); padding: 2px 6px; border-radius: 4px; }
    
    /* Обновена решетка за 5 брояча */
    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
    .stat-box { background: var(--panel); padding: 6px; border-radius: 4px; text-align: center; border: 1px solid var(--line); }
    .stat-val { display: block; font-weight: 900; font-size: 13px; }
    .stat-lab { font-size: 7px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .search-box { width: 100%; padding: 12px; background: #000; color: #fff; border: 2px solid var(--line); border-radius: 6px; outline: none; font-size: 16px; border-left: 5px solid var(--accent); margin-bottom: 8px; }

    .firms-section { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--accent); flex-shrink: 0; }
    #firmsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; padding: 4px 8px; max-height: 80px; overflow-y: auto; }
    
    .firm-card { background: #1e293b; padding: 6px; border-radius: 4px; display: flex; justify-content: space-between; border-left: 3px solid var(--accent); cursor: pointer; font-size: 10px; }
    .firm-card.active { background: var(--accent); color: #000; font-weight: bold; }

    .main-view { flex: 1; overflow-y: auto; background: #000; padding: 8px 8px 120px 8px; }
    .car-item { background: #020617; border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; position: relative; }
    .plate { display: inline-block; background: #fff; color: #000; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-weight: 900; font-size: 17px; margin-right: 8px; }
    
    .validity-tag { float: right; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .tag-v { background: rgba(34, 197, 94, 0.15); color: var(--accent); border: 1px solid var(--accent); }
    .tag-e { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }

    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; border-top: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; height: 85px; padding: 0 10px; z-index: 100; }
    .nav-btn { background: var(--panel); border: 1px solid var(--accent); color: #fff; width: 70px; height: 55px; border-radius: 8px; font-size: 22px; }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="version">TAXI PRO v72.0</div>
    <div id="fileDate" class="json-date">ЗАРЕДЕТЕ БАЗА</div>
  </div>
  
  <div class="stats-row">
    <div class="stat-box"><span id="statTotal" class="stat-val">0</span><span class="stat-lab">ОБЩО</span></div>
    <div class="stat-box"><span id="statActive" class="stat-val" style="color:var(--accent)">0</span><span class="stat-lab">АКТИВНИ</span></div>
    <div class="stat-box"><span id="statDrivers" class="stat-val" style="color:var(--blue)">0</span><span class="stat-lab">ВОДАЧИ</span></div>
    <div class="stat-box"><span id="statExpired" class="stat-val" style="color:var(--red)">0</span><span class="stat-lab">ИЗТЕКЛИ</span></div>
    <div class="stat-box"><span id="statFirms" class="stat-val" style="color:var(--highlight)">0</span><span class="stat-lab">ФИРМИ</span></div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
    <input type="file" id="f1" style="font-size: 10px; color: var(--muted);">
    <button onclick="location.reload()" style="background:var(--red); border:none; color:white; border-radius:4px; font-weight:bold; height: 30px;">ИЗЧИСТИ</button>
  </div>

  <input type="text" id="mainSearch" class="search-box" placeholder="Търсене по номер, фирма или име...">
</header>

<div id="firmsGrid" class="firms-section"></div>

<div class="main-view" id="scrollArea">
  <div id="resultsList"></div>
</div>

<footer>
  <button class="nav-btn" onclick="changePage(-1)">◄</button>
  <div style="text-align: center;">
    <div id="filterCount" style="font-weight:900; font-size:20px; color:#fff;">0</div>
    <div id="pageCount" style="font-size:12px; color:var(--muted);">СТРАНИЦА 1/1</div>
  </div>
  <button class="nav-btn" onclick="changePage(1)">►</button>
</footer>

<script>
let dbMap = new Map(), filtered = [], selectedOp = '', page = 1, pageSize = 50;
const today = new Date();

async function processFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const json = JSON.parse(await file.text());
  const items = Array.isArray(json) ? json : (json.data || json.items || []);

  items.forEach(item => {
    const op = (item.operatorName || item.operator || "ДРУГИ").trim();
    const vList = item.taxiLicensesVehiclesDrivers || item.vehicles || [item];
    
    vList.forEach(vData => {
      const v = vData.taxiLicenseVehicle || vData || {};
      const reg = (v.registerNumber || v.regNumber || "").toUpperCase().replace(/\s+/g, '');
      
      let maxDate = new Date("2000-01-01");
      const deepDate = (obj) => {
        if (!obj || typeof obj !== 'object') return;
        if (obj.validTo) { const d = new Date(obj.validTo); if (d > maxDate) maxDate = d; }
        Object.values(obj).forEach(val => { if (typeof val === 'object') deepDate(val); });
      };
      deepDate(vData);

      if (reg.length > 4) {
        if (!dbMap.has(reg) || maxDate > dbMap.get(reg).validTo) {
          dbMap.set(reg, { op, reg, model: (v.markAndModel || "—"), validTo: maxDate, drivers: new Set() });
        }
        const dName = vData.driverName || vData.taxiLicenseDriver?.driverName;
        if (dName) dbMap.get(reg).drivers.add(dName.trim());
      }
    });
  });
  apply();
}

function apply() {
  const query = document.getElementById('mainSearch').value.toLowerCase();
  const terms = query.split(' ').filter(t => t);
  const all = Array.from(dbMap.values());

  // Статистика
  const activeCars = all.filter(c => c.validTo >= today);
  const expiredCars = all.filter(c => c.validTo < today);
  
  const stats = {};
  activeCars.forEach(c => {
    if (!stats[c.op]) stats[c.op] = { active: 0, drivers: 0 };
    stats[c.op].active++;
    stats[c.op].drivers += Math.max(1, c.drivers.size);
  });

  const sortedOps = Object.entries(stats).sort((a,b) => b[1].active - a[1].active);
  document.getElementById('firmsGrid').innerHTML = sortedOps.map(([n, s]) => `
    <div class="firm-card ${selectedOp === n ? 'active' : ''}" onclick="selectedOp=(selectedOp==='${n.replace(/'/g, "\\'")} '?'':'${n.replace(/'/g, "\\'")}'); apply();">
      <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80px;">${n}</span>
      <span style="color:${selectedOp===n?'#000':'var(--accent)'}">🚗${s.active}</span>
    </div>`).join('');

  // Филтриране на списъка
  let temp = all.filter(c => terms.every(t => `${c.op} ${c.reg} ${c.model} ${Array.from(c.drivers).join(" ")}`.toLowerCase().includes(t)));
  if (selectedOp) temp = temp.filter(c => c.op === selectedOp);
  filtered = temp;

  // Обновяване на броячите в хедъра
  document.getElementById('statTotal').textContent = dbMap.size;
  document.getElementById('statActive').textContent = activeCars.length;
  document.getElementById('statDrivers').textContent = activeCars.reduce((a, b) => a + Math.max(1, b.drivers.size), 0);
  document.getElementById('statExpired').textContent = expiredCars.length;
  document.getElementById('statFirms').textContent = sortedOps.length;
  document.getElementById('filterCount').textContent = filtered.length;
  
  page = 1; render();
}

function render() {
  const vis = filtered.slice((page-1)*pageSize, page*pageSize);
  document.getElementById('pageCount').textContent = `СТРАНИЦА ${page} / ${Math.ceil(filtered.length/pageSize) || 1}`;
  document.getElementById('resultsList').innerHTML = vis.map(c => {
    const isExp = c.validTo < today;
    return `
      <div class="car-item" style="border-left: 4px solid ${isExp ? 'var(--red)' : 'var(--accent)'}">
        <div class="validity-tag ${isExp ? 'tag-e' : 'tag-v'}">${isExp ? '🚫' : '✅'} ${c.validTo.toLocaleDateString('bg-BG')}</div>
        <div style="font-size:10px; color:var(--muted); margin-bottom:4px;">${c.op}</div>
        <div><span class="plate">${c.reg}</span> <span style="color:var(--muted)">${c.model}</span></div>
        <div style="color:var(--blue); font-weight:bold; margin-top:6px; font-size:14px;">👤 ${Array.from(c.drivers).join(", ") || 'ТИТУЛЯР'}</div>
      </div>`;
  }).join('');
}

function changePage(d) { 
  const max = Math.ceil(filtered.length/pageSize);
  if (page+d >= 1 && page+d <= max) { page += d; render(); document.getElementById('scrollArea').scrollTop = 0; }
}

document.getElementById('f1').onchange = processFile;
document.getElementById('mainSearch').oninput = apply;
</script>
</body>
</html>
